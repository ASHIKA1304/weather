<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #cce0ff, #ffffff);
      color: #333;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    #datetime {
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .current-weather {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #e6f0ff;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .current-weather h2 {
      margin: 0;
    }

    .weather-icon {
      font-size: 50px;
    }

    .forecast {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .day {
      flex: 1;
      background: #f2f2f2;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .day .icon {
      font-size: 30px;
      margin-bottom: 5px;
    }

    @media (max-width: 600px) {
      .forecast {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Weather</h1>
  <div id="datetime">Loading date...</div>
  <input type="text" placeholder="Search city..." disabled>

  <div class="current-weather">
    <div>
      <h2>India</h2>
      <p style="font-size: 2em;">72°F</p>
      <p>Sunny</p>
    </div>
    <div class="weather-icon">☀️</div>
  </div>

  <div class="forecast">
    <div class="day">
      <div><strong>Fri</strong></div>
      <div class="icon">🌤️</div>
      <div>68°F</div>
    </div>
    <div class="day">
      <div><strong>Sat</strong></div>
      <div class="icon">🌧️</div>
      <div>64°F</div>
    </div>
    <div class="day">
      <div><strong>Sun</strong></div>
      <div class="icon">⛅</div>
      <div>70°F</div>
    </div>
  </div>
</div>

<script>
  function updateDateTime() {
    const now = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    document.getElementById('datetime').textContent = `${now.toLocaleDateString(undefined, options)} – ${time}`;
  }

  updateDateTime();
  setInterval(updateDateTime, 60000); // update every minute
</script>

</body>
</html>
